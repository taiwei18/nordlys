<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Top bar of T -->
  <line x1="4" y1="7" x2="28" y2="7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
  <!-- Vertical stem of T -->
  <line x1="16" y1="7" x2="16" y2="25" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
  <!-- W left wing -->
  <polyline points="6,15 11,25 16,16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />
  <!-- W right wing -->
  <polyline points="16,16 21,25 26,15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />
  <!-- Intersection pivot -->
  <circle cx="16" cy="16" r="1.25" fill="currentColor" />
</svg>
